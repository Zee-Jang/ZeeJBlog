<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#E4F7F3"/>
  <!-- ears -->
  <ellipse cx="16" cy="24" rx="7.5" ry="11" transform="rotate(-18 16 24)" fill="#0F7A73"/>
  <ellipse cx="48" cy="24" rx="7.5" ry="11" transform="rotate(18 48 24)" fill="#0F7A73"/>
  <!-- head -->
  <ellipse cx="32" cy="34" rx="19" ry="17.5" fill="#22B3A6"/>
  <!-- forehead highlight -->
  <ellipse cx="32" cy="27" rx="10" ry="5" fill="#3FCBBC" opacity=".55"/>
  <!-- cheeks -->
  <ellipse cx="17.5" cy="39.5" rx="4" ry="3" fill="#FF9EA8" opacity=".65"/>
  <ellipse cx="46.5" cy="39.5" rx="4" ry="3" fill="#FF9EA8" opacity=".65"/>
  <!-- muzzle -->
  <ellipse cx="32" cy="41" rx="10" ry="7.5" fill="#EAFBF7"/>
  <!-- eyes -->
  <ellipse cx="24" cy="31" rx="4.4" ry="5" fill="#0B3B3A"/>
  <ellipse cx="40" cy="31" rx="4.4" ry="5" fill="#0B3B3A"/>
  <circle cx="25.7" cy="29.2" r="1.7" fill="#fff"/>
  <circle cx="41.7" cy="29.2" r="1.7" fill="#fff"/>
  <circle cx="22.8" cy="33.2" r=".9" fill="#fff" opacity=".85"/>
  <circle cx="38.8" cy="33.2" r=".9" fill="#fff" opacity=".85"/>
  <!-- nose -->
  <path d="M32 41.3 c-3.4 0-5-2-5-3.5 0-1.5 2.2-2.4 5-2.4 s5 .9 5 2.4 c0 1.5-1.6 3.5-5 3.5z" fill="#0B3B3A"/>
  <!-- smile + tongue -->
  <path d="M27.5 43.4 a4.5 4.5 0 0 0 9 0" stroke="#0B3B3A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M29.5 45.4 h5 a2.5 2.5 0 0 1 -5 0z" fill="#FF7E92"/>
</svg>
